<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RogueAim 原型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- 像素字体只是锦上添花：异步加载，离线或被墙时自动退回系统等宽字体，不会阻塞游戏 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" media="print" onload="this.media='all'" />
  <style>
:root {
  /* CRT 荧光屏配色：磷光绿为主，琥珀色金币，品红警告 */
  --bg: #030806;
  --panel: rgba(3, 14, 9, 0.8);
  --line: #1b4634;
  --line-hi: #2f7a59;
  --text: #d4ffe8;
  --dim: #6b9e86;
  --accent: #39ff9f;
  --gold: #ffc23d;
  --danger: #ff3b6b;
  --good: #7dff8a;
  --rare: #c77dff;
  --star: #8fd3ff;
  --mono: "VT323", "Cascadia Mono", "Consolas", "Courier New", monospace;
  --glow: 0 0 6px rgba(57, 255, 159, 0.45);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
.panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px;
  box-shadow: inset 0 0 18px rgba(57, 255, 159, 0.06); }
#hud-tl { top: 16px; left: 16px; min-width: 260px; }
#hud-tr { top: 16px; right: 16px; text-align: right; min-width: 160px; }
.hp-row { display: flex; align-items: center; gap: 8px; }
#hp-bar { position: relative; flex: 1; height: 20px; background: #2a0d16; border-radius: 4px; overflow: hidden; }
#hp-fill { height: 100%; background: linear-gradient(90deg, #ff4d6d, #ff8fa3); transition: width 0.15s; }
#hp-text { position: absolute; inset: 0; text-align: center; font-size: 13px; line-height: 20px; font-weight: 600; }
#shield { display: flex; gap: 3px; }
#shield span { width: 14px; height: 18px; background: var(--accent); clip-path: polygon(50% 0, 100% 20%, 90% 75%, 50% 100%, 10% 75%, 0 20%); }
#relic-bar { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.relic-chip { font-size: 16px; width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 6px;
  background: #0a1f16; border: 1px solid var(--line); }
.relic-chip.rare { border-color: var(--rare); }
#wave-label { font-weight: 700; font-size: 16px; color: var(--accent); text-shadow: var(--glow); }
#enemies-left { color: var(--dim); font-size: 13px; margin: 2px 0 6px; }
#gold { font-family: var(--mono); font-size: 32px; line-height: 1; color: var(--gold); text-shadow: 0 0 8px rgba(255, 194, 61, 0.5); }

#crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.ch { position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
.ch-t, .ch-b { width: 2px; height: 7px; left: -1px; }
.ch-t { top: -11px; } .ch-b { top: 4px; }
.ch-l, .ch-r { height: 2px; width: 7px; top: -1px; }
.ch-l { left: -11px; } .ch-r { left: 4px; }
#hitmarker { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; opacity: 0;
  background:
    linear-gradient(45deg, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%),
    linear-gradient(-45deg, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%);
  -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); mask: radial-gradient(circle, transparent 5px, #000 6px); }
#hitmarker.show { animation: hm 0.18s ease-out; }
@keyframes hm { from { opacity: 1; transform: scale(1.3); } to { opacity: 0; transform: scale(1); } }

#hud-bottom { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); text-align: center; }
/* 火力评级 */
#rating-box { --tc: #8a93b8; width: 260px; margin: 0 auto; }
.rating-row { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
.rating-label, #rating-gold { font-size: 12px; color: var(--dim); width: 70px; }
.rating-label { text-align: right; }
#rating-gold { text-align: left; color: var(--gold); }
#rating { font-family: var(--mono); font-size: 64px; line-height: 0.9; color: var(--tc); text-shadow: 0 0 14px var(--tc), 3px 0 rgba(255, 0, 80, 0.35), -3px 0 rgba(0, 200, 255, 0.35); }
#rating-bar { height: 6px; margin-top: 4px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); }
#rating-fill { height: 100%; width: 0; background: var(--tc); box-shadow: 0 0 8px var(--tc); transition: width 0.12s; }
#rating-box.decay #rating-fill { animation: pulse 0.4s infinite alternate; }
#rating-box.up #rating { animation: tier-up 0.5s ease-out; }
#rating-box.down #rating { animation: shake 0.35s; color: var(--danger); }
@keyframes tier-up { 0% { transform: scale(1.8); filter: brightness(2); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
#focus-wrap { margin-top: 10px; width: 260px; }
#focus-bar { height: 8px; background: #0a1f16; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
#focus-fill { height: 100%; width: 0; background: linear-gradient(90deg, #7b2ff7, #c77dff); }
#focus-hint { font-size: 12px; color: var(--dim); margin-top: 4px; }
#focus-wrap.ready #focus-fill { background: linear-gradient(90deg, #c77dff, #fff); }
#focus-wrap.ready #focus-hint { color: #fff; font-weight: 700; animation: pulse 0.8s infinite alternate; }
#focus-wrap.active #focus-fill { background: #fff; }
@keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

/* 强化类别：基础 白 / 流派 蓝 / 核心 金 / 通用 灰 / 经济 绿 */
.item.cat-base { border-color: #6b7394; }
.item.cat-school { border-color: #3a5a9a; }
.item.cat-core { border-color: #ffd166; background: linear-gradient(180deg, #2e2814, #182039); box-shadow: 0 0 18px rgba(255, 209, 102, 0.18); }
.item.cat-core .name { color: var(--gold); }
.item.cat-general { border-color: #4a4f63; }
.item.cat-econ { border-color: #2f6a4a; }
.relic-chip { position: relative; }
.relic-chip.cat-core { border-color: var(--gold); box-shadow: 0 0 6px rgba(255, 209, 102, 0.5); }
.relic-chip sub { position: absolute; right: 2px; bottom: -2px; font-size: 10px; color: var(--dim); }
#heat { margin-top: 6px; height: 6px; background: #0a1f16; border-radius: 3px; overflow: hidden; }
#heat-fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffb703, #fb5607); }
#heat.full #heat-fill { background: #ff3d00; box-shadow: 0 0 8px #ff3d00; }
#crosshair.flick .ch { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.sens-info .stat .v { font-size: 20px; }
input.num { pointer-events: auto; width: 120px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: #0a1f16; color: var(--text); font: inherit; }
input[type=checkbox] { pointer-events: auto; width: 18px; height: 18px; }
#threat { position: absolute; inset: 0; width: 100%; height: 100%; }
#reload-ring { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; opacity: 0;
  background: conic-gradient(#fff calc(var(--p, 0) * 1turn), rgba(255,255,255,0.12) 0);
  -webkit-mask: radial-gradient(circle, transparent 18px, #000 19px); mask: radial-gradient(circle, transparent 18px, #000 19px); }
#reload-ring.on { opacity: 0.85; }
#ammo-box { right: 16px; bottom: 16px; text-align: right; min-width: 130px; }
#ammo { font-family: var(--mono); font-size: 48px; line-height: 0.9; text-shadow: var(--glow); }
#ammo.low { color: var(--danger); }
#ammo-hint { font-size: 12px; margin-top: 4px; }
#ammo-hint.reloading { color: #fff; font-weight: 700; }
#view.slowmo { filter: saturate(0.35) contrast(1.1); }

#focus-overlay { position: absolute; inset: 0; opacity: 0; transition: opacity 0.2s;
  box-shadow: inset 0 0 160px 30px rgba(199, 125, 255, 0.55); }
#focus-overlay.on { opacity: 1; }
#vignette { position: absolute; inset: 0; opacity: 0; box-shadow: inset 0 0 200px 60px rgba(255, 30, 60, 0.75); transition: opacity 0.4s; }
#vignette.hit { opacity: 1; transition: none; }
#vignette.low { opacity: 0.35; }
#hurtdir { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; opacity: 0;
  border-radius: 50%; border-top: 6px solid var(--danger); transition: opacity 0.6s; }
#hurtdir.on { opacity: 1; transition: none; }

#radar { position: absolute; left: 16px; bottom: 16px; width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle, rgba(57, 255, 159, 0.08), rgba(3, 14, 9, 0.7) 70%); border: 1px solid var(--line-hi);
  box-shadow: 0 0 14px rgba(57, 255, 159, 0.15); }

#floaters { position: absolute; inset: 0; overflow: hidden; }
.floater { position: absolute; font-weight: 800; font-size: 18px; transform: translate(-50%, -50%);
  animation: rise 0.9s ease-out forwards; text-shadow: 0 1px 3px #000; white-space: nowrap; }
.floater.gold { color: var(--gold); }
.floater.big { font-size: 24px; }
.floater.head { color: #ff9e00; }
.floater.warn { color: var(--danger); }
.floater.info { color: var(--star); font-size: 15px; }
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -50px; } }

#banner { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 800;
  opacity: 0; letter-spacing: 6px; color: var(--accent); text-shadow: 0 0 20px rgba(57, 255, 159, 0.7), 3px 0 rgba(255, 0, 80, 0.4), -3px 0 rgba(0, 200, 255, 0.4); }
#banner.show { animation: banner 1.8s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.3); } 15% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- 全屏界面：CRT 复古终端 ---------- */
.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, rgba(4, 30, 20, 0.88), rgba(1, 5, 3, 0.96) 75%);
  backdrop-filter: blur(3px); overflow-y: auto; padding: 24px 16px; }
.overlay[hidden] { display: none; }
/* 扫描线 + 暗角 + 轻微闪烁，只在菜单界面出现，不干扰瞄准 */
#crt-fx { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 20; transition: opacity 0.2s;
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
  animation: flicker 6s infinite steps(1); }
.overlay:not([hidden]) ~ #crt-fx { opacity: 1; }
@keyframes flicker { 0%, 100% { filter: none; } 47% { filter: brightness(1.08); } 48% { filter: none; } 82% { filter: brightness(0.92); } 83% { filter: none; } }

.card { position: relative; background: rgba(2, 12, 8, 0.94); border: 1px solid var(--line-hi); border-radius: 14px; padding: 24px 28px;
  width: min(1040px, 100%); max-height: 100%; overflow-y: auto;
  box-shadow: 0 0 0 4px rgba(57, 255, 159, 0.04), 0 0 60px rgba(57, 255, 159, 0.12), inset 0 0 80px rgba(57, 255, 159, 0.05);
  text-shadow: 0 0 2px rgba(212, 255, 232, 0.35); animation: power-on 0.35s ease-out; }
@keyframes power-on { 0% { transform: scaleY(0.02); filter: brightness(3); } 60% { transform: scaleY(1.02); } 100% { transform: none; filter: none; } }
.card::-webkit-scrollbar { width: 8px; }
.card::-webkit-scrollbar-thumb { background: var(--line-hi); }
.boot { font-family: var(--mono); font-size: 18px; color: var(--dim); letter-spacing: 1px; }
.cursor { animation: blink 1s infinite steps(1); color: var(--accent); margin-left: 4px; }
@keyframes blink { 50% { opacity: 0; } }
.title-head { margin-top: 6px; align-items: flex-end; }
.logo { position: relative; font-family: var(--mono); font-weight: 400; font-size: clamp(56px, 10vw, 104px); line-height: 0.85; margin: 0;
  letter-spacing: 6px; color: var(--accent);
  text-shadow: 0 0 18px rgba(57, 255, 159, 0.7), 3px 0 rgba(255, 0, 80, 0.55), -3px 0 rgba(0, 200, 255, 0.55); }
.logo span { color: var(--gold); text-shadow: 0 0 18px rgba(255, 194, 61, 0.7), 3px 0 rgba(255, 0, 80, 0.55), -3px 0 rgba(0, 200, 255, 0.55); }
.logo::after { content: attr(data-text); position: absolute; left: 0; top: 0; color: var(--accent); opacity: 0;
  clip-path: inset(40% 0 45% 0); animation: glitch 4s infinite steps(1); }
@keyframes glitch { 0%, 92%, 100% { opacity: 0; } 93% { opacity: 0.8; transform: translateX(6px); } 95% { opacity: 0.8; transform: translateX(-4px); clip-path: inset(10% 0 75% 0); } 97% { opacity: 0; } }
.subtitle { color: var(--dim); font-size: 13px; letter-spacing: 2px; margin-top: 6px; }
.big-num { font-family: var(--mono); font-size: 40px; line-height: 1; text-shadow: 0 0 12px rgba(143, 211, 255, 0.6); }
.big-num small { font-family: inherit; font-size: 16px; margin-left: 6px; color: var(--dim); }
h1 { margin: 0 0 4px; font-size: 40px; letter-spacing: 3px; }
h2 { margin: 0 0 14px; font-size: 24px; color: var(--accent); text-shadow: var(--glow); letter-spacing: 1px; }
h2::before { content: '> '; font-family: var(--mono); color: var(--dim); }
h3 { margin: 18px 0 8px; font-size: 15px; color: var(--accent); letter-spacing: 2px; text-shadow: var(--glow); }
h3::before { content: '// '; color: var(--dim); }
p { margin: 6px 0; }
.dim { color: var(--dim); }
.small { font-size: 13px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.rules { padding-left: 18px; margin: 0; line-height: 1.7; }
.rules li::marker { content: '▸ '; color: var(--accent); }
.screen-body { border-top: 1px dashed var(--line); padding-top: 4px; }

.btn { pointer-events: auto; cursor: pointer; padding: 9px 18px; border-radius: 2px; border: 1px solid var(--line-hi);
  background: rgba(57, 255, 159, 0.05); color: var(--text); font-weight: 600; transition: background 0.1s, color 0.1s; }
.btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent); color: #021008; text-shadow: none; box-shadow: 0 0 14px rgba(57, 255, 159, 0.5); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.primary { background: var(--accent); border: none; color: #021008; font-size: 20px; padding: 12px 34px; letter-spacing: 3px;
  text-shadow: none; box-shadow: 0 0 20px rgba(57, 255, 159, 0.5); }
.btn.primary:hover:not(:disabled) { background: #b8ffdc; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: #6a1f33; color: var(--danger); background: transparent; }
.btn.danger:hover:not(:disabled) { background: var(--danger); color: #12020a; border-color: var(--danger); }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 14px 0; }
.item { position: relative; background: rgba(57, 255, 159, 0.03); border: 1px solid var(--line); border-radius: 4px; padding: 16px; display: flex;
  flex-direction: column; gap: 8px; text-align: left; color: var(--text); transition: transform 0.1s, box-shadow 0.1s; }
button.item { cursor: pointer; }
button.item:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 0 22px rgba(57, 255, 159, 0.25); }
.item.curse { border-color: #7a2030; }
.item.sold { opacity: 0.3; }
.item:disabled { cursor: not-allowed; }
.item .icon { font-size: 34px; filter: drop-shadow(0 0 6px rgba(57, 255, 159, 0.35)); }
.item .name { font-size: 18px; font-weight: 700; }
.item .desc { font-size: 14px; color: #b9e6cf; flex: 1; line-height: 1.5; }
.item .tag { font-size: 12px; color: var(--dim); }
.item .price { font-family: var(--mono); font-size: 26px; line-height: 1; color: var(--gold); text-shadow: 0 0 8px rgba(255, 194, 61, 0.5); }
.item .price.no { color: var(--danger); text-shadow: none; }
.item.heal { border-color: #2a5a3a; }
.item.well { border-color: #7a5a1a; }
.item.star { border-color: #2a4a6a; background: rgba(143, 211, 255, 0.04); }
/* 强化类别：基础 白 / 流派 蓝 / 核心 金 / 通用 灰 / 经济 绿 */
.item.cat-base { border-color: #4f6a5e; }
.item.cat-school { border-color: #2d5a7a; }
.item.cat-core { border-color: var(--gold); background: linear-gradient(180deg, rgba(255, 194, 61, 0.1), rgba(2, 12, 8, 0.4)); box-shadow: 0 0 18px rgba(255, 194, 61, 0.18); }
.item.cat-core .name { color: var(--gold); }
.item.cat-general { border-color: #3d4a44; }
.item.cat-econ { border-color: #2f6a4a; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.stat { background: rgba(57, 255, 159, 0.04); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; }
.stat .v { font-family: var(--mono); font-size: 34px; line-height: 1; color: var(--accent); text-shadow: var(--glow); }
.stat .k { font-size: 12px; color: var(--dim); margin-top: 2px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px dashed #173a2b; }
th { color: var(--dim); font-weight: 500; }

.bar3 { display: flex; height: 18px; border-radius: 2px; overflow: hidden; background: #0a1f16; margin: 6px 0; }
.bar3 > div { height: 100%; }
.c-heal { background: #4caf73; } .c-relic { background: #c77dff; } .c-star { background: #5aa9ff; }
.legend span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; }
.warn-box { margin-top: 8px; padding: 8px 10px; border-radius: 3px; border: 1px solid #6a3a12; background: rgba(255, 140, 40, 0.08); color: #ffc285; font-size: 13px; }
.ok-box { margin-top: 8px; padding: 8px 10px; border-radius: 3px; border: 1px solid #1f5a3a; background: rgba(57, 255, 159, 0.06); color: #a8f0c0; font-size: 13px; }

.menu, .tabs { display: flex; gap: 4px; margin: 16px 0 10px; flex-wrap: wrap; }
.tab { pointer-events: auto; cursor: pointer; padding: 6px 12px; border-radius: 2px; border: 1px solid transparent; background: transparent; color: var(--dim); }
.tab:hover { color: var(--text); border-color: var(--line); }
.tab.on { color: #021008; background: var(--accent); border-color: var(--accent); text-shadow: none; box-shadow: 0 0 12px rgba(57, 255, 159, 0.45); }
.menu .tab { font-size: 15px; letter-spacing: 2px; padding: 8px 14px; }
.menu .tab::before { content: '[ '; opacity: 0.6; }
.menu .tab::after { content: ' ]'; opacity: 0.6; }
.menu .tab.on::before { content: '▶ '; opacity: 1; }

.upgrade { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: rgba(57, 255, 159, 0.03); }
.upgrade .lv { font-size: 12px; color: var(--dim); }
.kind { font-size: 11px; padding: 1px 6px; border-radius: 2px; margin-left: 6px; border: 1px solid currentColor; }
.stardust { color: var(--star); font-weight: 700; }
.goldtxt { color: var(--gold); font-weight: 700; }
.spark { display: inline-block; vertical-align: middle; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; align-items: center; }
kbd { font-family: var(--mono); font-size: 16px; background: rgba(57, 255, 159, 0.06); border: 1px solid var(--line-hi); border-bottom-width: 3px; border-radius: 3px; padding: 0 7px; color: var(--accent); }
input[type=range] { width: 200px; pointer-events: auto; accent-color: var(--accent); }
input.num { pointer-events: auto; width: 120px; padding: 6px 8px; border-radius: 2px; border: 1px solid var(--line-hi); background: #031009; color: var(--accent); font-family: var(--mono); font-size: 18px; }
input[type=checkbox] { pointer-events: auto; width: 18px; height: 18px; accent-color: var(--accent); }
.sens-info .stat .v { font-size: 26px; }

/* ---------- 命盘 ---------- */
.deck-head { margin: 10px 0 4px; }
.grasp { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.grasp span { width: 14px; height: 14px; border: 1px solid var(--line-hi); transform: rotate(45deg) scale(0.75); }
.grasp span.full { background: var(--accent); box-shadow: 0 0 8px var(--accent); border-color: var(--accent); }
.deck-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.deck-card { --cc: var(--accent); position: relative; pointer-events: auto; cursor: pointer; min-height: 200px; padding: 8px 8px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; color: var(--text);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.25)); border: 1px solid #234536; border-radius: 6px;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s; }
.deck-card::before { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 4px; pointer-events: none; }
.deck-card:hover:not(.dis):not(.dormant):not(.inrun) { transform: translateY(-3px); border-color: var(--cc); }
.deck-card.dis, .deck-card.dormant, .deck-card.inrun { cursor: default; }
.dc-top { width: 100%; display: flex; justify-content: space-between; font-size: 11px; }
.dc-cost { color: var(--cc); letter-spacing: -1px; }
.pip-wake { font-family: var(--mono); font-size: 14px; }
.dc-cat { color: var(--dim); }
.dc-icon { font-size: 30px; margin-top: 2px; filter: grayscale(0.6) brightness(0.8); }
.dc-name { font-weight: 700; font-size: 14px; color: var(--cc); }
.dc-desc { font-size: 11.5px; line-height: 1.4; color: #a9d6bf; flex: 1; }
.dc-desc .cond { margin-top: 4px; color: var(--dim); font-size: 10.5px; }
.dc-foot { font-size: 11px; color: var(--dim); border-top: 1px dashed #234536; width: 100%; padding-top: 4px; }
.deck-card.locked { opacity: 0.55; background: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.02) 0 6px, transparent 6px 12px); }
.deck-card.locked .dc-icon { filter: grayscale(1) brightness(0.5); }
.deck-card.locked:not(.dis) { opacity: 0.85; }
.deck-card.off.nofit { opacity: 0.6; }
.deck-card.on { border-color: var(--cc); background: linear-gradient(180deg, color-mix(in srgb, var(--cc) 18%, transparent), rgba(0, 0, 0, 0.3));
  box-shadow: 0 0 18px color-mix(in srgb, var(--cc) 45%, transparent), inset 0 0 20px color-mix(in srgb, var(--cc) 15%, transparent); }
.deck-card.on .dc-icon { filter: drop-shadow(0 0 8px var(--cc)); }
.deck-card.on .dc-foot { color: var(--cc); }
.deck-card.dormant { border-style: dashed; }
.deck-card.awake { animation: awake 2s infinite alternate; }
@keyframes awake { from { box-shadow: 0 0 10px color-mix(in srgb, var(--cc) 40%, transparent); } to { box-shadow: 0 0 26px var(--cc); } }
@media (max-width: 760px) {
  .deck-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.relic-chip.temp { border-color: var(--gold); border-style: dashed; }
#hp-text, #ammo-hint, #enemies-left { letter-spacing: 1px; }

/* 同一界面原地刷新时不重放开机动画（装备卡牌时不闪屏） */
.overlay.instant .card { animation: none; }
.core-txt { color: #ff7ad9; font-weight: 700; text-shadow: 0 0 8px rgba(255, 122, 217, 0.5); }
.big-num .core-txt small { color: var(--dim); }
.deck-card { user-select: none; }
.dc-lv { color: var(--cc); font-size: 10px; letter-spacing: 1px; }
.dc-desc .vals span { color: var(--dim); }
.dc-desc .vals span.past { color: #6f8f80; }
.dc-desc .vals span.cur { color: var(--cc); font-weight: 700; text-shadow: 0 0 6px var(--cc); }
.dc-desc .vals i { font-style: normal; color: #2f5a46; margin: 0 1px; }
.dc-foot { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.dc-up { pointer-events: auto; cursor: pointer; font-size: 11px; padding: 1px 6px; border: 1px solid var(--line-hi); border-radius: 2px;
  background: rgba(57, 255, 159, 0.06); color: var(--text); }
.dc-up:hover:not(:disabled) { border-color: var(--accent); background: rgba(57, 255, 159, 0.2); }
.dc-up:disabled { opacity: 0.35; cursor: not-allowed; }
.dc-max { font-size: 11px; color: var(--cc); }
.deck-card.inrun { border-style: dashed; border-color: var(--cc); }
.wake-routes { text-align: left; line-height: 1.5; }
.wake-routes b { display: inline-block; width: 1em; color: var(--dim); }
.wake-routes b.ok { color: var(--good); text-shadow: 0 0 6px var(--good); }

/* Boss 血条 */
#boss-bar { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: min(560px, 60vw); text-align: center; }
.boss-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text); text-shadow: 0 0 6px rgba(0, 0, 0, 0.8); }
#boss-name { font-weight: 700; letter-spacing: 1px; }
#boss-status { color: var(--gold); font-weight: 700; }
#boss-hp { position: relative; height: 12px; margin-top: 4px; background: rgba(0, 0, 0, 0.55); border: 1px solid #6a1f33; }
#boss-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff3b6b, #ff8fa3); box-shadow: 0 0 10px rgba(255, 59, 107, 0.6); transition: width 0.12s; }
#boss-bar.vuln #boss-fill { background: linear-gradient(90deg, #ffc23d, #fff3b0); box-shadow: 0 0 14px var(--gold); }
#boss-hint { margin-top: 4px; font-size: 12px; color: var(--dim); text-shadow: 0 0 4px #000; }
</style>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div id="vignette"></div>
    <div id="focus-overlay"></div>
    <div id="hurtdir"></div>
    <canvas id="threat"></canvas>

    <div id="crosshair">
      <span class="ch ch-t"></span><span class="ch ch-b"></span>
      <span class="ch ch-l"></span><span class="ch ch-r"></span>
      <div id="hitmarker"></div>
      <div id="reload-ring"></div>
    </div>

    <div id="ammo-box" class="panel">
      <div id="ammo"><span id="ammo-val">10</span><span class="dim"> / <span id="ammo-max">10</span></span></div>
      <div id="ammo-hint" class="dim">R 换弹</div>
      <div id="heat" hidden><div id="heat-fill"></div></div>
    </div>

    <div id="hud-tl" class="panel">
      <div class="hp-row">
        <div id="hp-bar"><div id="hp-fill"></div><span id="hp-text"></span></div>
        <div id="shield"></div>
      </div>
      <div id="relic-bar"></div>
    </div>

    <div id="hud-tr" class="panel">
      <div id="wave-label"></div>
      <div id="enemies-left"></div>
      <div id="gold"><span class="coin">●</span> <span id="gold-val">0</span></div>
    </div>

    <div id="boss-bar" hidden>
      <div class="boss-row"><span id="boss-name"></span><span id="boss-status"></span></div>
      <div id="boss-hp"><div id="boss-fill"></div></div>
      <div id="boss-hint"></div>
    </div>

    <div id="hud-bottom">
      <div id="rating-box">
        <div class="rating-row"><span class="rating-label">火力评级</span><span id="rating">D</span><span id="rating-gold">金币 ×1</span></div>
        <div id="rating-bar"><div id="rating-fill"></div></div>
      </div>
      <div id="focus-wrap">
        <div id="focus-bar"><div id="focus-fill"></div></div>
        <div id="focus-hint">专注充能中</div>
      </div>
    </div>

    <canvas id="radar" width="180" height="180"></canvas>
    <div id="floaters"></div>
    <div id="banner"></div>
  </div>

  <div id="screen" class="overlay"></div>
  <div id="crt-fx" aria-hidden="true"></div>
