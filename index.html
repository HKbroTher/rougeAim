<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RogueAim 原型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- 像素字体只是锦上添花：异步加载，离线或被墙时自动退回系统等宽字体，不会阻塞游戏 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div id="vignette"></div>
    <div id="focus-overlay"></div>
    <div id="hurtdir"></div>
    <canvas id="threat"></canvas>

    <div id="crosshair">
      <span class="ch ch-t"></span><span class="ch ch-b"></span>
      <span class="ch ch-l"></span><span class="ch ch-r"></span>
      <div id="hitmarker"></div>
      <div id="reload-ring"></div>
    </div>

    <div id="ammo-box" class="panel">
      <div id="ammo"><span id="ammo-val">10</span><span class="dim"> / <span id="ammo-max">10</span></span></div>
      <div id="ammo-hint" class="dim">R 换弹</div>
      <div id="heat" hidden><div id="heat-fill"></div></div>
    </div>

    <div id="hud-tl" class="panel">
      <div class="hp-row">
        <div id="hp-bar"><div id="hp-fill"></div><span id="hp-text"></span></div>
        <div id="shield"></div>
      </div>
      <div id="relic-bar"></div>
    </div>

    <div id="hud-tr" class="panel">
      <div id="wave-label"></div>
      <div id="enemies-left"></div>
      <div id="gold"><span class="coin">●</span> <span id="gold-val">0</span></div>
    </div>

    <div id="boss-bar" hidden>
      <div class="boss-row"><span id="boss-name"></span><span id="boss-status"></span></div>
      <div id="boss-hp"><div id="boss-fill"></div></div>
      <div id="boss-hint"></div>
    </div>

    <div id="hud-bottom">
      <div id="rating-box">
        <div class="rating-row"><span class="rating-label">火力评级</span><span id="rating">D</span><span id="rating-gold">金币 ×1</span></div>
        <div id="rating-bar"><div id="rating-fill"></div></div>
      </div>
      <div id="focus-wrap">
        <div id="focus-bar"><div id="focus-fill"></div></div>
        <div id="focus-hint">专注充能中</div>
      </div>
    </div>

    <canvas id="radar" width="180" height="180"></canvas>
    <div id="floaters"></div>
    <div id="banner"></div>
  </div>

  <div id="screen" class="overlay"></div>
  <div id="crt-fx" aria-hidden="true"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
